services:
  - type: web
    name: olivium-sistemas
    runtime: static
    buildCommand: npm install && npm run build
    publishDir: dist
    pullRequestPreviewsEnabled: false
    # SPA fallback: todas as rotas (ex.: /servicos, /blog/:slug) caem em index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable